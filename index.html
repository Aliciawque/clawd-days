<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Clawd Days — a pixel pet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B2140; --cream:#FFF8E7; --paper:#FFFFFF;
  --coral:#FF6B5E; --orange:#FF9F43; --yellow:#FFD23F; --green:#2ED47A;
  --aqua:#27C7E8; --blue:#4D8BFF; --indigo:#6C5CE7; --pink:#FF7EB6;
  --bg1:#7FD4FF; --bg2:#E4F8FF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Pixelify Sans','Courier New',monospace; color:var(--ink);
  background:linear-gradient(180deg,var(--bg1),var(--bg2)); background-attachment:fixed;
  display:flex; justify-content:center; padding:12px 12px 28px; transition:background .8s;
  user-select:none; -webkit-user-select:none;
}
#app{width:100%;max-width:620px;background:var(--cream);border:4px solid var(--ink);
  box-shadow:0 8px 0 var(--ink),0 8px 0 4px rgba(43,33,64,.15);padding:12px;position:relative}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.title{font-weight:700;font-size:26px;letter-spacing:1px;color:var(--coral);text-shadow:2px 2px 0 var(--ink)}
.topbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tb{font:inherit;font-weight:600;font-size:13px;padding:5px 8px;border:3px solid var(--ink);background:var(--paper);
  color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);position:relative}
.tb:active{transform:translateY(3px);box-shadow:none}
.tb .dot{position:absolute;top:-6px;right:-6px;width:12px;height:12px;background:var(--coral);border:2px solid var(--ink);display:none}
.tb.has .dot{display:block;animation:bob .6s infinite alternate}
.hud{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.chip{border:3px solid var(--ink);background:var(--paper);padding:3px 8px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.chip.grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.chip.coin{background:var(--yellow)}
.chip.streak{background:#FFB1A3}
img.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.stage{position:relative;border:4px solid var(--ink);background:#000;line-height:0;overflow:hidden}
#scene{width:100%;height:auto;display:block;cursor:pointer;touch-action:manipulation}
#bubble{position:absolute;transform:translate(-50%,-100%);background:var(--paper);border:3px solid var(--ink);
  padding:4px 8px;font-size:14px;font-weight:600;line-height:1.15;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
#bubble.on{opacity:1}
#bubble:after{content:'';position:absolute;left:50%;bottom:-9px;width:8px;height:6px;margin-left:-4px;background:var(--ink);
  clip-path:polygon(0 0,100% 0,50% 100%)}
#fx{position:absolute;inset:0;pointer-events:none;line-height:1}
.float{position:absolute;font-weight:700;font-size:18px;transform:translate(-50%,-50%);text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);
  animation:floatUp 1.1s ease-out forwards;white-space:nowrap}
@keyframes floatUp{to{transform:translate(-50%,-260%);opacity:0}}
@keyframes bob{to{transform:translateY(-3px)}}
#toasts{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;line-height:1.2;z-index:5}
.toast{background:var(--ink);color:#fff;border:3px solid var(--yellow);padding:6px 12px;font-size:15px;font-weight:600;
  animation:toastIn .25s ease-out, toastOut .4s 3.2s forwards;text-align:center}
.toast b{color:var(--yellow)}
@keyframes toastIn{from{transform:translateY(-20px);opacity:0}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:10px}
.bar{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.bar .lab{width:58px;display:flex;align-items:center;gap:4px}
.bar .track{flex:1;height:14px;border:3px solid var(--ink);background:#E9E2D0;position:relative}
.bar .fill{height:100%;width:50%;transition:width .3s;background-image:linear-gradient(rgba(255,255,255,.45) 0 35%,transparent 35%)}
.bar.low .track{animation:shake .4s infinite}
@keyframes shake{25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}
.info{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;font-weight:600;flex-wrap:wrap}
.info .nm{font-size:17px;font-weight:700}
.xp{flex:1;min-width:80px;height:10px;border:3px solid var(--ink);background:#E9E2D0}
.xp i{display:block;height:100%;background:var(--indigo);width:0;transition:width .3s}
.skills{display:flex;gap:6px;font-size:13px}
.skills span{border:2px solid var(--ink);padding:1px 6px;background:var(--paper)}
.actions{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.act{font:inherit;font-weight:700;font-size:13px;color:var(--ink);border:3px solid var(--ink);padding:7px 2px 5px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 4px 0 var(--ink);background:var(--paper)}
.act:active{transform:translateY(4px);box-shadow:none}
.act:disabled{filter:grayscale(1) opacity(.5);cursor:not-allowed}
.act img{width:32px;height:32px}
#bFeed{background:#FFB8A8}#bSleep{background:#C2B8FF}#bStudy{background:#A9CCFF}#bPlay{background:#FFE58A}#bBath{background:#A6ECF7}#bShop{background:#FFB6D5}
@media(max-width:480px){.actions{grid-template-columns:repeat(3,1fr)}.title{font-size:20px}.chip{font-size:13px}}
#modal{position:fixed;inset:0;background:rgba(43,33,64,.6);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
#modal.hidden{display:none}
.card{background:var(--cream);border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink);width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:14px;position:relative}
.card h2{margin:0 0 8px;font-size:22px;color:var(--coral);text-shadow:2px 2px 0 var(--ink);letter-spacing:1px}
.card p{margin:6px 0;font-size:15px;line-height:1.3}
.x{position:absolute;top:8px;right:8px}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);background:var(--paper);padding:6px 8px;font-size:14px}
.row .g{flex:1;min-width:0}
.row .g b{display:block;font-size:15px}
.row .g small{opacity:.75;font-size:12.5px}
.row.locked{opacity:.5}
.row.done{background:#D5F8E1}
.row img{width:32px;height:32px;flex:none}
.btn{font:inherit;font-weight:700;font-size:14px;border:3px solid var(--ink);background:var(--yellow);color:var(--ink);padding:5px 10px;cursor:pointer;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn:disabled{background:#ddd;opacity:.6;cursor:not-allowed}
.btn.big{font-size:17px;padding:8px 18px;background:var(--green)}
.btn.red{background:var(--coral);color:#fff}
.center{text-align:center}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:300px;margin:10px auto}
.pad{height:90px;border:4px solid var(--ink);cursor:pointer;opacity:.45;transition:opacity .08s,transform .08s;box-shadow:0 4px 0 var(--ink)}
.pad.lit{opacity:1;transform:scale(1.04)}
#mg{width:100%;border:4px solid var(--ink);display:block;touch-action:none;cursor:ew-resize}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.cell{border:3px solid var(--ink);background:var(--paper);padding:6px 2px;text-align:center;font-size:11.5px;font-weight:600}
.cell img{width:32px;height:32px}
.cell.unk{opacity:.35;filter:grayscale(1)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.week div{border:3px solid var(--ink);padding:6px 0;text-align:center;font-size:12px;font-weight:700;background:var(--paper)}
.week div.got{background:var(--green)}.week div.today{background:var(--yellow);animation:bob .5s infinite alternate}
h3{margin:12px 0 6px;font-size:16px}
.locs{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:4px solid var(--ink);border-top:0}
.loc{font:inherit;font-weight:700;font-size:13px;color:var(--ink);background:var(--paper);border:0;border-right:3px solid var(--ink);padding:6px 0;cursor:pointer}
.loc:last-child{border-right:0}.loc.on{background:var(--yellow)}.loc:active{background:#FFE98A}
.hearts{color:var(--coral);letter-spacing:1px}
.sw{width:26px;height:26px;border:3px solid var(--ink);flex:none}
.wg{display:grid;grid-template-columns:repeat(5,40px);gap:4px;justify-content:center;margin:8px 0}
.wc{width:40px;height:40px;border:3px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px}
.kb{display:flex;justify-content:center;gap:3px;margin-top:4px}
.k{font:inherit;font-weight:700;font-size:14px;min-width:27px;padding:8px 3px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.fortune{font-size:56px;font-weight:700;color:var(--coral);margin:4px 0;font-family:serif}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">CLAWD DAYS</div>
    <div class="topbtns">
      <button class="tb" id="tQuests">QUESTS<i class="dot"></i></button>
      <button class="tb" id="tTroph">TROPHIES<i class="dot"></i></button>
      <button class="tb" id="tFriends">FRIENDS<i class="dot"></i></button>
      <button class="tb" id="tJournal">JOURNAL</button>
      <button class="tb" id="tSound">♪ ON</button>
    </div>
  </header>
  <div class="hud">
    <div class="chip grow" id="dateChip">Spring</div>
    <div class="chip streak" id="streakChip">🔥 1</div>
    <div class="chip coin"><img class="px" id="coinImg" width="16" height="16" alt=""><span id="coins">0</span></div>
  </div>
  <div class="stage">
    <canvas id="scene" width="200" height="150"></canvas>
    <div id="bubble"></div><div id="fx"></div><div id="flash"></div><div id="toasts"></div>
  </div>
  <div class="locs"><button class="loc" data-loc="home">HOME</button><button class="loc" data-loc="garden">GARDEN</button><button class="loc" data-loc="school">SCHOOL</button><button class="loc" data-loc="funfair">FUNFAIR</button><button class="loc" data-loc="lake">LAKE</button></div>
  <div class="bars">
    <div class="bar" id="barFood"><span class="lab">FOOD</span><div class="track"><div class="fill" style="background-color:var(--coral)"></div></div></div>
    <div class="bar" id="barEnergy"><span class="lab">ENERGY</span><div class="track"><div class="fill" style="background-color:var(--yellow)"></div></div></div>
    <div class="bar" id="barMood"><span class="lab">MOOD</span><div class="track"><div class="fill" style="background-color:var(--pink)"></div></div></div>
    <div class="bar" id="barClean"><span class="lab">CLEAN</span><div class="track"><div class="fill" style="background-color:var(--aqua)"></div></div></div>
  </div>
  <div class="info">
    <span class="nm" id="stageName">Egg</span><span id="lvl">Lv 1</span>
    <div class="xp"><i id="xpFill"></i></div>
    <div class="skills"><span id="skS" title="Smarts">📘 0</span><span id="skV" title="Vigor">⭐ 0</span><span id="skC" title="Charm">💗 0</span></div>
  </div>
  <div class="actions">
    <button class="act" id="bFeed"><img class="px" data-ic="onigiri" alt="">FEED</button>
    <button class="act" id="bSleep"><img class="px" data-ic="moon" alt=""><span id="sleepLab">SLEEP</span></button>
    <button class="act" id="bStudy"><img class="px" data-ic="book" alt="">STUDY</button>
    <button class="act" id="bPlay"><img class="px" data-ic="star" alt="">PLAY</button>
    <button class="act" id="bBath"><img class="px" data-ic="drop" alt="">BATH</button>
    <button class="act" id="bShop"><img class="px" data-ic="bag" alt="">SHOP</button>
  </div>
</div>
<div id="modal" class="hidden"><div class="card"><button class="tb x" id="mClose">✕</button><div id="modalBody"></div></div></div>

let AC=null;
function beep(f,d=0.08,v=0.035,when=0,type='square'){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),ga=AC.createGain();o.type=type;o.frequency.value=f;o.connect(ga);ga.connect(AC.destination);const t=AC.currentTime+when;ga.gain.setValueAtTime(v,t);ga.gain.exponentialRampToValueAtTime(0.0001,t+d);o.start(t);o.stop(t+d+0.02);}catch(e){}}
const jingle=(notes,step=0.09)=>notes.forEach((f,i)=>beep(f,0.13,0.035,i*step));

 big:()=>jingle([523,659,784,1047,784,1047],0.1),eat:()=>jingle([330,392,330,392],0.11),squash:()=>beep(140,0.09,0.05),pet:()=>beep(880,0.06,0.025,0,'triangle')};

function toast(html){const t=document.createElement('div');t.className='toast';t.innerHTML=html;$('toasts').appendChild(t);setTimeout(()=>t.remove(),3700);while($('toasts').children.length>3)$('toasts').firstChild.remove();}
function floatText(text,x,y,color='#FFD23F'){const e=document.createElement('span');e.className='float';e.textContent=text;e.style.left=(x/W*100)+'%';e.style.top=(y/H*100)+'%';e.style.color=color;$('fx').appendChild(e);setTimeout(()=>e.remove(),1100);}
let bubbleT=0;
function say(text,dur=2.6){const b=$('bubble');b.textContent=text;b.classList.add('on');bubbleT=dur;}
function addCoins(n,x,y){if(!n)return;if(n>0)n=Math.round(n*luck());S.coins+=n;if(n>0){S.n.earned+=n;if(x!=null)floatText('+'+n,x,y);}}
function gainXP(n){if(S.stage===0)return;if(S.buddy==='rabbit')n=Math.ceil(n*1.2);S.xp+=n;let up=false;while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;up=true;const rew=10+S.lvl*5;addCoins(rew);toast(`LEVEL UP! <b>Lv ${S.lvl}</b> &nbsp;+${rew} coins`);}
 if(up){sfx.big();checkEvolve();}}
function quest(ev,amt=1){for(const q of S.daily.quests){const def=QUEST_POOL.find(d=>d.id===q.id);if(!def||def.ev!==ev||q.done)continue;q.prog=def.max?Math.max(q.prog,amt):q.prog+amt;if(q.prog>=def.goal){q.prog=def.goal;q.done=true;toast(`Quest done: <b>${def.text}</b>`);sfx.ok();}}}
function checkAch(){for(const a of ACH){if(!S.ach[a.id]&&a.c(S)){S.ach[a.id]=1;addCoins(a.r);toast(`🏆 <b>${a.name}</b> &nbsp;+${a.r} coins`);sfx.big();newTrophy=true;}}}

/* ---------- actions ---------- */
function canAct(){if(S.stage===0){say('Tap the egg!');return false;}if(S.sleeping){say('Zzz…');return false;}if(pet.anim){return false;}return true;}
function feed(id){const f=FOODS.find(x=>x.id===id);if(!f||!canAct())return;
 if(S.stats.food>95){say('So full…');sfx.bad();return;}
 const cost=price(f);if(S.coins<cost){say('Not enough coins…');sfx.bad();return;}
 S.coins-=cost;closeModal();startAnim('eat',1.8,{food:id});sfx.eat();const fav=id===S.fav;
 S.stats.food=clamp(S.stats.food+f.food,0,100);S.stats.mood=clamp(S.stats.mood+f.mood+(fav?15:0),0,100);if(f.energy)S.stats.energy=clamp(S.stats.energy+f.energy,0,100);
 const first=!S.foods[id];S.foods[id]=(S.foods[id]||0)+1;S.n.meals++;if(f.mood>10)S.skills.charm+=1;gainXP(first?10:4);quest('meal');
 if(first)toast(`New food tasted: <b>${f.name}</b>`);
 if(fav){if(!S.favKnown){S.favKnown=true;toast(`💗 <b>${f.name}</b> is Clawd's favorite food!`);}setTimeout(()=>{say('My FAVORITE!!');spawnFx('heart',pet.x,110,5);},700);}
 else if(f.say)setTimeout(()=>say(f.say),700);}
function medicine(){if(!S.sick)return;const cost=Math.min(10,S.coins);S.coins-=cost;S.sick=false;S.neglect=0;S.stats.food=Math.max(S.stats.food,30);S.stats.clean=Math.max(S.stats.clean,30);closeModal();startAnim('happy',1);sfx.ok();say('All better!');}
function toggleSleep(){if(S.stage===0){say('Tap the egg!');return;}if(S.sleeping)wake(false);else{if(S.stats.energy>85&&nightF(hour())<0.5){say('Not sleepy!');sfx.bad();return;}goTo('home',true);S.sleeping=true;S.sleptGh=0;pet.anim=null;sfx.tap();say('Good night…',1.5);}}
function wake(auto){S.sleeping=false;pet.x=104;pet.tx=96;if(S.sleptGh>=5){S.stats.mood=clamp(S.stats.mood+12,0,100);gainXP(8);quest('night');say('What a great sleep!');startAnim('happy',1);}else say(auto?'Good morning!':'…huh? I\'m up!');S.sleptGh=0;sfx.ok();}
function bath(){if(!canAct())return;if(S.stats.clean>92){say('Already squeaky clean!');sfx.bad();return;}
 goTo('home',true);startAnim('bath',2.6);S.stats.clean=100;S.stats.mood=clamp(S.stats.mood+6,0,100);S.skills.charm+=2;S.n.baths++;gainXP(5);quest('bath');jingle([784,880,988,1175],0.12);}
function petClawd(){if(S.sleeping){say('Zzz…',1);return;}if(pet.petCd>0)return;pet.petCd=0.35;S.n.pets++;S.stats.mood=clamp(S.stats.mood+2.5,0,100);S.skills.charm+=0.4;gainXP(1);quest('pet');

/* ---------- time-of-day ---------- */
const NIGHT=['#10165A','#3A46B4'],DAWN=['#5868E8','#FFB088'],DUSK=['#5438CC','#FF7F4F'];
function skyAt(h,s){const day=SEASONS[s].sky;const K=[[0,NIGHT],[4.5,NIGHT],[6,DAWN],[7.6,day],[16.6,day],[18.3,DUSK],[20,NIGHT],[24,NIGHT]];
 for(let i=0;i<K.length-1;i++){if(h>=K[i][0]&&h<=K[i+1][0]){const t=(h-K[i][0])/(K[i+1][0]-K[i][0]);return[mix(K[i][1][0],K[i+1][1][0],t),mix(K[i][1][1],K[i+1][1][1],t)];}}return NIGHT;}
function nightF(h){if(h<4.5||h>=20)return 1;if(h<6.8)return 1-(h-4.5)/2.3;if(h>17.6)return(h-17.6)/2.4;return 0;}
function duskF(h){return Math.max(0,1-Math.abs(h-6)/1.2,1-Math.abs(h-18.3)/1.5);}

/* ---------- simulation ---------- */
function update(dt){
 if(bubbleT>0){bubbleT-=dt;if(bubbleT<=0)$('bubble').classList.remove('on');}
 pet.petCd-=dt;
 for(const f of fxs){f.life-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.type==='spark')f.vy+=50*dt;if(f.type==='leaf')f.vy+=60*dt;}
 fxs=fxs.filter(f=>f.life>0);
 for(const c of clouds){c.x+=c.v*dt;if(c.x>240){c.x=-50;c.y=rnd(8,46);}}
 updateParticles(dt);
 if(paused)return;
 const gh=dt/GH_SEC*(S.sleeping?6:1);
 S.clock+=gh;
 const se=seasonIdx();
 if(se!==lastSeason){if(lastSeason!==-1){toast(`${SEASONS[se].emoji} <b>${SEASONS[se].name}</b> has arrived!`);sfx.ok();}lastSeason=se;if(!S.seasons.includes(se))S.seasons.push(se);initParticles();applyTheme();}
 // weather
 if(S.clock>weather.until){weather.rain=Math.random()<(se===3?0.3:se===1?0.22:0.28);weather.until=S.clock+rnd(3,8);}
 const h=hour(),n=nightF(h);
 // shooting stars
 if(shoot){shoot.t-=dt;shoot.x+=70*dt;shoot.y+=26*dt;if(shoot.t<=0)shoot=null;}
 else if(n>0.8&&!weather.rain&&!S.sleeping&&S.loc!=='home'){shootCd-=dt;if(shootCd<=0){shoot={x:rnd(10,90),y:rnd(4,26),t:2.4};shootCd=rnd(25,60);beep(1568,0.3,0.015,0,'sine');}}
 if(S.stage===0){if(pet.wob>0)pet.wob-=dt;talkCd-=dt;if(talkCd<=0){say('Tap the egg!');talkCd=7;}return;}
 const st=S.stats;
 if(S.sleeping){S.sleptGh+=gh;st.energy+=(n>0.5?14:8)*gh;st.food-=1.2*gh;st.mood-=0.4*gh;st.clean-=0.4*gh;
  if(st.energy>=100){st.energy=100;if(h>=6&&h<20)wake(true);}}
 else{st.energy-=4.5*gh;st.food-=3*gh;st.clean-=(1.4+bugs.length*0.9)*(S.buddy==='frog'?0.7:1)*gh;
  let md=2.2;if(st.food<25)md+=2;if(st.clean<25)md+=1.5;if(st.energy<20)md+=1;if(S.sick)md*=2;if(S.buddy==='cat')md*=0.8;st.mood-=md*gh;
  if(st.energy<=0){if(S.loc!=='home'){S.loc='home';visitor=null;flash('#2B2140');toast('Clawd dozed off, so you carried him home.');}S.sleeping=true;S.sleptGh=0;pet.anim=null;say('…zzz',1.5);}}
 for(const k in st)st[k]=clamp(st[k],0,100);
 if(st.food<=0||st.clean<=0){S.neglect+=gh;if(S.neglect>5&&!S.sick){S.sick=true;toast('Clawd feels <b>sick</b>… give medicine (FEED menu).');sfx.bad();}}else S.neglect=Math.max(0,S.neglect-gh*0.5);
 // bugs
 if(!S.sleeping){bugCd-=dt;if(bugCd<=0&&bugs.length<4){bugs.push({x:Math.random()<0.5?-4:204,y:rint(124,140),dir:1,gold:Math.random()<0.1,t:0});bugCd=rnd(18,42);}}
 for(const b of bugs){b.t+=dt;if(b.x<14)b.dir=1;if(b.x>186)b.dir=-1;if(Math.random()<0.004)b.dir*=-1;b.x+=b.dir*6*dt;}
 updateWorld(dt,gh);updateVisitor(dt);updateBuddy(dt);
 // movement / animation
 pet.blink-=dt;if(pet.blink<-0.15)pet.blink=rnd(2,5);
 if(pet.anim){pet.anim.t-=dt;if(pet.anim.type==='bath'&&Math.random()<0.3)fxs.push({type:'bubble',x:pet.x+rnd(-18,18),y:rnd(110,130),vx:rnd(-4,4),vy:rnd(-16,-6),life:rnd(0.6,1.2)});if(pet.anim.t<=0){const ty=pet.anim.type;pet.anim=null;animEnd(ty);}}
 else if(!S.sleeping){const sad=st.mood<30||S.sick;if(pet.wait>0)pet.wait-=dt;else{const d=pet.tx-pet.x;if(Math.abs(d)<1){pet.wait=rnd(1,4.5);pet.tx=rnd(64,138);}else{pet.dir=Math.sign(d);pet.x+=pet.dir*(sad?6:13)*dt;pet.walkT+=dt;}}}
 if(S.sleeping&&Math.random()<dt*0.9)fxs.push({type:'z',x:(S.loc==='home'?170:pet.x+8),y:(S.loc==='home'?100:132-9*petSize()),vx:4,vy:-9,life:1.6});
 // chatter
 talkCd-=dt;if(talkCd<=0&&bubbleT<=0&&!S.sleeping&&!pet.anim){talkCd=rnd(7,13);say(pickLine());}
}
const IDLE=['Pondering…','Noodling…','Clauding…','Vibing…','Percolating…','✻ Thinking…','Moseying…','Nice day!','*happy crab noises*'];
function pickLine(){const st=S.stats,h=hour(),se=seasonIdx();
 if(S.sick)return'I don\'t feel so good…';if(st.food<25)return'So hungry…';if(st.energy<20)return'Sleepy…';if(st.clean<25)return'I need a bath…';if(bugs.length>=3)return'Bugs everywhere!';if(st.mood<30)return'Play with me?';
 if(nightF(h)>0.8&&S.loc!=='home'&&Math.random()<0.5)return['The stars are out!','*yawn*','Watch for shooting stars!'][rint(0,2)];
 if(Math.random()<0.35)return[['Sakura petals!','Spring smells sweet.'],['So sunny!','Watermelon time?'],['Crunchy leaves!','Sweet potato weather.'],['Snow!!','Brrr… cocoa?']][se][rint(0,1)];
 if(weather.rain&&se!==3)return'Pitter patter…';
 if(Math.random()<0.3)return LOC_LINES[S.loc][rint(0,1)];
 return IDLE[rint(0,IDLE.length-1)];}

/* ---------- particles ---------- */
function initParticles(){particles=[];const se=seasonIdx();const n=se===3?46:se===1?10:30;for(let i=0;i<n;i++)particles.push({x:rnd(0,W),y:rnd(0,H),p:rnd(0,6.28),v:rnd(0.6,1.4),k:rint(0,2)});}
function updateParticles(dt){const se=seasonIdx();for(const p of particles){p.p+=dt*2;
 if(se===0){p.x+=(10+Math.sin(p.p)*8)*p.v*dt;p.y+=11*p.v*dt;}
 else if(se===1){p.x+=Math.sin(p.p*0.7+p.k)*14*dt;p.y+=Math.cos(p.p*0.9)*9*dt;if(p.y<60)p.y=60;if(p.y>138)p.y=138;}
 else if(se===2){p.x+=(-8+Math.sin(p.p)*14)*p.v*dt;p.y+=15*p.v*dt;}
 else{p.x+=Math.sin(p.p*0.6)*6*dt;p.y+=(weather.rain?26:13)*p.v*dt;}
 if(p.y>H+2){p.y=-2;p.x=rnd(0,W);}if(p.x>W+3)p.x=-2;if(p.x<-3)p.x=W+2;}}

/* ---------- scene rendering ---------- */
const FOL=[[0,0,15],[-14,7,10],[14,6,11],[-7,-10,10],[9,-9,10],[0,9,10]];
const TUFTS=[];for(let i=0;i<34;i++)TUFTS.push([rint(2,196),rint(110,147),rint(0,3)]);
function drawScene(time){
 const h=hour(),se=seasonIdx(),P=SEASONS[se],n=nightF(h),du=duskF(h);
 NQ=Math.round(n*10);DQ=Math.round(du*5);
 let [top,bot]=skyAt(h,se);
 const rainy=weather.rain&&se!==3;
 if(weather.rain){const gray=se===3?'#B9C6DD':'#7C8BA8';const amt=(se===3?0.3:0.45)*(1-n*0.6);top=mix(top,gray,amt);bot=mix(bot,gray,amt);}
 // sky bands with dithered seams
 const B=12,bh=9;for(let i=0;i<B;i++){const c=mix(top,bot,i/(B-1));R(0,i*bh,W,bh,c);if(i>0){g.fillStyle=c;for(let x=(i%2);x<W;x+=2)g.fillRect(x,i*bh-1,1,1);}}
 // stars
 if(n>0.15){for(const s of stars){const tw=0.5+0.5*Math.sin(time*2+s.p);const a=n*(0.45+0.55*tw);g.fillStyle=mix(top,s.b?'#FFF4B8':'#FFFFFF',a);g.fillRect(s.x,s.y,1,1);if(s.b&&tw>0.6){g.fillRect(s.x-1,s.y,3,1);g.fillRect(s.x,s.y-1,1,3);}}}
 if(shoot){for(let i=0;i<14;i++){g.fillStyle=mix('#FFFFFF',top,i/14);g.fillRect(Math.round(shoot.x-i*2.6),Math.round(shoot.y-i*0.97),i<3?2:1,i<3?2:1);}}
 // sun & moon
 if(h>5.4&&h<18.8){const a=(h-6)/12,sx=20+160*a,sy=96-Math.sin(Math.PI*a)*82;const sc=mix('#FFE45C','#FF8A3D',du);circ(sx,sy,10,mix(top,sc,0.35));circ(sx,sy,8,sc);circ(sx-1,sy-1,5,mix(sc,'#FFFFFF',0.45));}
 if(h>=17.8||h<6.4){const a=((h+6)%24)/12,mx=20+160*a,my=96-Math.sin(Math.PI*a)*78;circ(mx,my,9,mix(top,'#FFF6C9',0.25));circ(mx,my,7,'#FFF6C9');circ(mx+3,my-2,6,mix(top,'#FFF6C9',0.12));g.fillStyle='#E8D99A';g.fillRect(Math.round(mx)-4,Math.round(my)+2,2,1);g.fillRect(Math.round(mx)-5,Math.round(my)-1,1,1);}
 // clouds
 const cw=mix(mix('#FFFFFF','#FFC2A1',du*0.7),'#5560C0',n*0.55),cs=mix(mix(se===1?'#CDEBFF':'#DDEBFF','#FF9E8A',du*0.7),'#3A429C',n*0.55);
 const cloudCount=weather.rain?5:(se===1?4:3);
 for(let i=0;i<cloudCount;i++){const c=clouds[i],s=c.s*(se===1?1.35:1)*(weather.rain?1.3:1),x=c.x,y=c.y;
  circ(x,y+2,Math.round(6*s),cs);circ(x+9*s,y+3,Math.round(7*s),cs);circ(x+19*s,y+3,Math.round(5*s),cs);
  circ(x,y,Math.round(6*s),cw);circ(x+8*s,y-3*s,Math.round(8*s),cw);circ(x+18*s,y,Math.round(6*s),cw);if(se===1)circ(x+11*s,y-9*s,Math.round(6*s),cw);
  R(x-6*s,y+2,30*s,Math.round(4*s),cw);R(x-5*s,y+2+Math.round(4*s),28*s,2,cs);}
 const indoor=S.loc==='home';
 if(indoor){drawWeatherFx(se,n,time,rainy);NQ=S.sleeping?7:(n>0.5?1:0);DQ=0;drawHome(se,n,time,P);}
 else SCENES[S.loc](se,n,time,P,h,top,bot);
 // bugs
 for(const b of bugs){const f=Math.floor(b.t*8)%2;drawIcon(b.gold?'gbug':'bug',b.x-4,b.y-4+(f?0:0),1,b.gold?null:T);if(f){R(b.x-4,b.y+3,1,1,T('#2B2140'));R(b.x+3,b.y+3,1,1,T('#2B2140'));}if(b.gold&&Math.floor(time*6)%3===0)R(b.x+rint(-4,4),b.y+rint(-5,2),1,1,'#FFFFFF');}
 // pet
 drawWorld(time);drawVisitor(time);drawBuddy(time);drawPet(time);drawMarkers(time);
 // effects
 for(const f of fxs){const x=Math.round(f.x),y=Math.round(f.y);
  if(f.type==='heart'){const c='#FF4D8D';R(x-2,y-1,2,2,c);R(x+1,y-1,2,2,c);R(x-2,y,5,2,c);R(x-1,y+2,3,1,c);R(x,y+3,1,1,c);R(x-2,y-1,1,1,'#FFC2DA');}
  else if(f.type==='spark'){const c=['#FFFFFF','#FFE45C','#FF9EC4','#9BE3FF'][(x+y)&3];R(x,y-1,1,3,c);R(x-1,y,3,1,c);}
  else if(f.type==='bubble'){R(x,y-1,2,1,'#FFFFFF');R(x-1,y,1,2,'#D6F6FF');R(x+2,y,1,2,'#D6F6FF');R(x,y+2,2,1,'#9BE3FF');R(x,y,1,1,'#FFFFFF');}
  else if(f.type==='z'){const c='#FFFFFF';R(x,y,4,1,c);R(x+2,y+1,1,1,c);R(x+1,y+2,1,1,c);R(x,y+3,4,1,c);}
  else if(f.type==='splat'){R(x-2,y,5,1,'#9B6BFF');R(x,y-2,1,5,'#9B6BFF');R(x-1,y-1,3,3,'#C9A8FF');}
  else if(f.type==='leaf'){R(x,y,2,2,f.c);}
  else if(f.type==='ripple'){const rr=Math.round((0.9-f.life)*10)+1;R(x-rr,y,rr*2,1,'#FFFFFF');if(rr>2)R(x-rr+2,y+1,rr*2-4,1,'#9BE3FF');}}
 if(!indoor)drawWeatherFx(se,n,time,rainy);
}
function drawWeatherFx(se,n,time,rainy){
 // front particles
 for(const p of particles){const x=Math.round(p.x),y=Math.round(p.y);
  if(se===0){g.fillStyle=T(p.k?'#FFB3D1':'#FF8FBE');g.fillRect(x,y,2,1);g.fillRect(x+(Math.sin(p.p)>0?1:0),y+1,1,1);}
  else if(se===1){if(n>0.5){const on=Math.sin(p.p*1.3+p.k)>0;if(on){g.fillStyle='#E9FF70';g.fillRect(x,y,1,1);g.fillStyle='rgba(220,255,90,0.3)';g.fillRect(x-1,y-1,3,3);}}
   else if(p.k<2&&!rainy){const flap=Math.sin(p.p*6)>0;g.fillStyle=p.k?'#FFFFFF':'#FFE45C';g.fillRect(x-(flap?2:1),y,flap?2:1,2);g.fillRect(x+1,y,flap?2:1,2);g.fillStyle='#2B2140';g.fillRect(x,y,1,2);}}
  else if(se===2){g.fillStyle=T(['#FF7A2F','#E0452A','#FFC12E'][p.k]);g.fillRect(x,y,2,2);g.fillRect(x+(Math.sin(p.p)>0?2:-1),y+1,1,1);}
  else{g.fillStyle='#FFFFFF';const big=p.k===0;g.fillRect(x,y,big?2:1,big?2:1);}}
 if(rainy){g.fillStyle=mix('#BDE6FF','#5A6AD0',n*0.5);for(let i=0;i<70;i++){const x=(i*37+time*90*(1+(i%3)*0.2))%220-10,y=(i*53+time*260*(1+(i%4)*0.1))%160-5;g.fillRect(Math.round(x),Math.round(y),1,4);}}
}
function drawMountains(P,se){
 // far mountains
 const mt=T(P.mtn),mt2=T(mix(P.mtn,'#FFFFFF',0.25)),snow=T('#FFFFFF');
 for(let y=62;y<106;y++){const hw=(y-62)*1.25+2;R(150-hw,y,hw*2,1,mt2);}
 for(let y=44;y<106;y++){const hw=(y-44)*1.15+3;R(72-hw,y,hw*2,1,mt);R(72+hw*0.35,y,hw*0.65,1,T(mix(P.mtn,'#3B2FA0',0.18)));}
 const capH=se===3?26:se===1?8:14;
 for(let y=44;y<44+capH;y++){const hw=(y-44)*1.15+3;R(72-hw,y,hw*2,1,snow);}
 for(let x=-18;x<=18;x+=4){const yb=44+capH,hw=(yb-44)*1.15+3;if(Math.abs(x)<hw){R(72+x-1,yb,3,2,snow);R(72+x,yb+2,1,2,snow);}}
 if(se===3){for(let y=62;y<76;y++){const hw=(y-62)*1.25+2;R(150-hw,y,hw*2,1,snow);}}
}

 for(let x=0;x<W;x++){const y=Math.round(102+Math.sin(x*0.03+2)*4+Math.sin(x*0.07)*1.5);R(x,y,1,112-y,hn);}
 // ground

 for(const t of TUFTS){const c=t[2]===0?grL:grD;R(t[0],t[1],1,2,c);R(t[0]+1,t[1]+1,1,1,c);

 openModal(h+'</div>');}
function journalMenu(){const age=Math.floor((S.clock-S.born)/24);
 let h=`<h2>JOURNAL</h2><p><b>${stageName()}</b> · Generation ${S.gen} · ${age} day${age===1?'':'s'} old · Lv ${S.lvl}</p>
 <p>Smarts ${Math.floor(S.skills.smarts)} · Vigor ${Math.floor(S.skills.vigor)} · Charm ${Math.floor(S.skills.charm)}<br><small>How you raise Clawd decides the final form (reached at Lv 7).</small></p>
 <h3>Final forms ${S.forms.length}/4</h3><div class="grid">`;
 for(const k in FORMS){const ok=S.forms.includes(k);h+=`<div class="cell ${ok?'':'unk'}"><img class="px" src="${ok?formURL(k):iconURL('q')}" alt=""><br>${ok?FORMS[k].name:'???'}<br><small>${ok?FORMS[k].hint:''}</small></div>`;}
 h+=`</div><h3>Foods tasted ${FOODS.filter(f=>S.foods[f.id]).length}/${FOODS.length}</h3><div class="grid">`;
 for(const f of FOODS){const ok=S.foods[f.id];h+=`<div class="cell ${ok?'':'unk'}">${ic(ok?f.id:'q')}<br>${ok?f.name+' ×'+ok:'???'}</div>`;}
 h+=`</div><h3>Seasons seen</h3><p>${SEASONS.map((s,i)=>S.seasons.includes(i)?s.emoji+' '+s.name:'❔').join(' &nbsp; ')}</p>
 <h3>Fish caught ${FISH.filter(q=>S.fish[q.id]).length}/${FISH.length}</h3><div class="grid">${FISH.map(q=>{const r=S.fish[q.id];return `<div class="cell ${r?'':'unk'}"><img class="px" src="${r?fishURL(q):iconURL('q')}" alt=""><br>${r?q.name+'<br><small>×'+r.n+' · best '+r.max+' cm</small>':'???'}</div>`;}).join('')}</div>
 <h3>Capsule toys ${TOYS.filter(q=>S.toys[q.id]).length}/${TOYS.length}</h3><div class="grid">${TOYS.map(q=>`<div class="cell ${S.toys[q.id]?'':'unk'}">${ic(S.toys[q.id]?'t_'+q.id:'q')}<br>${S.toys[q.id]?q.name:'???'}</div>`).join('')}</div>
 <h3>Crops grown ${CROPS.filter(q=>S.crops[q.id]).length}/${CROPS.length}</h3><p>${CROPS.map(q=>S.crops[q.id]?q.name+' ×'+S.crops[q.id]:'???').join(' · ')}</p>
 <h3>Places visited ${S.places.length}/5</h3><p>${Object.keys(LOCS).map(k=>S.places.includes(k)?LOCS[k].name:'???').join(' · ')}</p>
 <p>Favorite food: <b>${S.favKnown?FOODS.find(f=>f.id===S.fav).name:'???'}</b> <small>(try different foods to find out)</small></p>
 <h3>Records</h3><p>Meals ${S.n.meals} · Pets ${S.n.pets} · Bugs ${S.n.bugs} · Wishes ${S.n.stars}<br>Best Memory Tokens: round ${S.n.bestSimon} · Best Star Catch: ${S.n.bestCatch}</p>
 <h3>How to play</h3><p><small>Tap Clawd to pet. Use the place tabs to travel; each place has its own food and animal visitors. Sparkles mark things you can tap: plant and water crops in the garden, fish from the lake dock, draw a daily fortune at the torii, play the Daily Word at school, ride and collect capsule toys at the funfair. Tap an animal to make friends. Tap bugs to squash them for coins. At night, tap the sky when a shooting star passes. One in-game hour is ${GH_SEC} seconds; a season lasts ${DAYS_PER_SEASON} days. Clawd never dies, but neglect makes him sick.</small></p>
 <p class="center">${S.stage>=3?'<button class="btn big" id="jEgg">RAISE A NEW EGG</button> ':''}<button class="btn red" id="jReset">ERASE SAVE</button></p>`;
 openModal(h);
 if($('jEgg'))$('jEgg').onclick=()=>{if(confirm('Send '+stageName()+' off on an adventure and start a new egg? You keep coins, hats, trophies and the journal.'))newEgg();};
 $('jReset').onclick=()=>{if(confirm('Erase ALL progress? This cannot be undone.')){localStorage.removeItem(SAVE_KEY);window.onbeforeunload=null;noSave=true;location.reload();}};}
let noSave=false;
const formURLCache={};
function formURL(k){if(formURLCache[k])return formURLCache[k];const c=document.createElement('canvas');c.width=c.height=32;const pg=g;g=c.getContext('2d');drawClawd(16,29,2,{stage:3,form:k,noTint:true});g=pg;return formURLCache[k]=c.toDataURL();}

/* ---------- daily systems ---------- */
function seededPick(seedStr,n){let s=0;for(const ch of seedStr)s=(s*31+ch.charCodeAt(0))>>>0;const arr=QUEST_POOL.map(q=>q.id);const out=[];while(out.length<n){s=(s*1664525+1013904223)>>>0;out.push(arr.splice(s%arr.length,1)[0]);}return out;}
function dailyCheck(){const t=today();
 if(S.daily.date!==t){S.daily={date:t,quests:seededPick(t,3).map(id=>({id,prog:0,done:false,claimed:false})),bonus:false};}
 if(S.streak.last!==t){const prev=S.streak.last?Math.round((new Date(t)-new Date(S.streak.last))/864e5):0;S.streak.n=prev===1?S.streak.n+1:1;S.streak.last=t;return true;}return false;}
function dailyReward(){const n=S.streak.n,dayIn=((n-1)%7)+1,rew=15+dayIn*10+(dayIn===7?60:0);
 let h=`<h2>DAILY GIFT</h2><p class="center">Day <b>${n}</b> streak! Come back tomorrow to keep it going.</p><div class="week">`;
 for(let i=1;i<=7;i++)h+=`<div class="${i<dayIn?'got':i===dayIn?'today':''}">D${i}<br>${15+i*10+(i===7?60:0)}</div>`;
 h+=`</div><p class="center"><button class="btn big" id="dClaim">CLAIM ${rew} COINS</button></p>`;
 openModal(h,()=>{addCoins(rew);sfx.coin();toast(`Daily gift: <b>+${rew} coins</b>`);checkAch();});$('dClaim').onclick=closeModal;}
function applyAway(sec){if(sec<60){return null;}const min=sec/60;S.clock+=sec/GH_SEC;for(const p of S.plots)if(p)p.g+=sec/GH_SEC;
 if(S.stage===0)return null;const loss=Math.min(55,min*0.4);const st=S.stats;['food','mood','clean'].forEach(k=>st[k]=Math.max(Math.min(st[k],20),st[k]-loss));
 if(min>30){st.energy=Math.max(st.energy,85);S.sleeping=false;}
 const gift=Math.round((min>=10?Math.min(60,5+Math.floor(min/6)):0)*(S.buddy==='duck'?1.5:1));return{min,gift};}
function welcomeBack(r){const hrs=r.min>=60?Math.floor(r.min/60)+'h '+Math.floor(r.min%60)+'m':Math.floor(r.min)+' min';
 openModal(`<h2>WELCOME BACK</h2><p class="center">You were away for <b>${hrs}</b>.<br>Clawd kept busy and found <b>${r.gift} coins</b> for you!</p><p class="center">${ic('coin')}</p><p class="center"><button class="btn big" id="wOk">THANKS, CLAWD</button></p>`,()=>{addCoins(r.gift);sfx.coin();afterWelcome();});$('wOk').onclick=closeModal;}
let pendingDaily=false;
function afterWelcome(){if(pendingDaily){pendingDaily=false;setTimeout(dailyReward,250);}}

/* ---------- mini-game: Memory Tokens ---------- */
function studyGame(){if(!canAct())return;if(S.sick){say('Too sick to study…');return;}if(S.stats.energy<15){say('Too tired to study…');sfx.bad();return;}
 goTo('school',true);S.stats.energy-=15;paused=true;const cols=['#FF6B5E','#FFD23F','#2ED47A','#4D8BFF'],tones=[330,392,494,587];
 let seq=[],pos=0,round=0,input=false,over=false,timers=[];
 openModal(`<h2>MEMORY TOKENS</h2><p class="center" id="sgMsg">Watch the tokens, then repeat them.</p><div class="pads">${cols.map((c,i)=>`<div class="pad" data-i="${i}" style="background:${c}"></div>`).join('')}</div><p class="center">Round <b id="sgRound">0</b> · Best ${S.n.bestSimon}</p>`,finish);
 const pads=[...$('modalBody').querySelectorAll('.pad')];
 const light=(i,ms)=>{pads[i].classList.add('lit');beep(tones[i],ms/1000,0.04);timers.push(setTimeout(()=>pads[i].classList.remove('lit'),ms*0.8));};
 function next(){input=false;seq.push(rint(0,3));pos=0;const sp=Math.max(230,520-seq.length*28);$('sgMsg').textContent='Watch…';
  seq.forEach((v,i)=>timers.push(setTimeout(()=>light(v,sp),500+i*sp)));timers.push(setTimeout(()=>{input=true;if($('sgMsg'))$('sgMsg').textContent='Your turn!';},500+seq.length*sp));}
 pads.forEach(pd=>pd.onpointerdown=()=>{if(!input||over)return;const i=+pd.dataset.i;light(i,200);
  if(i!==seq[pos]){over=true;sfx.bad();$('sgMsg').innerHTML='Oops! <button class="btn big" id="sgEnd">COLLECT</button>';$('sgEnd').onclick=closeModal;return;}
  pos++;if(pos>=seq.length){round=seq.length;$('sgRound').textContent=round;input=false;timers.push(setTimeout(next,600));}});
 function finish(){timers.forEach(clearTimeout);paused=false;const coins=round*3,sm=(round*1.5+1)*(S.buddy==='sparrow'?1.25:1);S.skills.smarts+=sm;S.n.studies++;S.n.bestSimon=Math.max(S.n.bestSimon,round);addCoins(coins,pet.x,100);gainXP(4+round*2);quest('simon',round);
  toast(`Study done! Round <b>${round}</b> · +${coins} coins · +${Math.floor(sm)} smarts`);startAnim('happy',1);checkAch();}
 timers.push(setTimeout(next,700));}

/* ---------- mini-game: Star Catch ---------- */
let mg=null;
function playGame(){if(!canAct())return;if(S.sick){say('Too sick to play…');return;}if(S.stats.energy<20){say('Too tired to play…');sfx.bad();return;}
 goTo('funfair',true);S.stats.energy-=20;paused=true;
 openModal(`<h2>STAR CATCH</h2><p class="center">Move Clawd to catch stars and treats. Dodge the bugs!<br>Time <b id="mgT">25</b> · Score <b id="mgS">0</b> · Best ${S.n.bestCatch}</p><canvas id="mg" width="200" height="150"></canvas>`,endPlay);
 const c=$('mg');mg={ctx:c.getContext('2d'),x:100,tx:100,t:25,score:0,items:[],spawn:0.5,done:false,keys:0,walk:0,pop:[]};
 const mv=e=>{const r=c.getBoundingClientRect();mg.tx=clamp((e.clientX-r.left)/r.width*W,14,186);};
 c.addEventListener('pointermove',mv);c.addEventListener('pointerdown',mv);}
function endPlay(){if(!mg)return;const sc=Math.max(0,mg.score);mg=null;paused=false;const vg=sc/3+1,cn=Math.round(sc*(S.buddy==='dog'?1.25:1));S.skills.vigor+=vg;S.n.plays++;S.n.bestCatch=Math.max(S.n.bestCatch,sc);S.stats.mood=clamp(S.stats.mood+18,0,100);addCoins(cn,pet.x,100);gainXP(4+Math.floor(sc/2));quest('catch',sc);
 toast(`Play time! Score <b>${sc}</b> · +${cn} coins · +${Math.floor(vg)} vigor`);startAnim('happy',1);checkAch();}
addEventListener('keydown',e=>{if(mg){if(e.key==='ArrowLeft'||e.key==='a')mg.keys=-1;if(e.key==='ArrowRight'||e.key==='d')mg.keys=1;}if(e.key==='Escape')closeModal();
 if(dash&&(e.key===' '||e.key==='ArrowUp')){e.preventDefault();dashJump();}
 if(wordOpen&&!e.ctrlKey&&!e.metaKey&&(e.key==='Enter'||e.key==='Backspace'||/^[a-zA-Z]$/.test(e.key))){e.preventDefault();wordKey(e.key);}});
addEventListener('keyup',e=>{if(mg&&['ArrowLeft','ArrowRight','a','d'].includes(e.key))mg.keys=0;});
function mgFrame(dt,time){
 const m=mg,se=seasonIdx(),P=SEASONS[se];
 if(!m.done){m.t-=dt;if(m.keys)m.tx=clamp(m.tx+m.keys*130*dt,14,186);const d=m.tx-m.x;m.x+=clamp(d,-170*dt,170*dt);if(Math.abs(d)>1)m.walk+=dt;
  m.spawn-=dt;if(m.spawn<=0){const r=Math.random(),prog=1-m.t/25;m.items.push({x:rnd(12,188),y:-8,v:rnd(45,70)+prog*45,k:r<0.24?'bug':r<0.38?'treat':'star'});m.spawn=rnd(0.28,0.55)-prog*0.12;}
  const p=petSize(),hw=(S.stage===1?4:7)*p+3;
  for(const it of m.items){it.y+=it.v*dt;if(!it.hit&&it.y>138-9*p-6&&it.y<140&&Math.abs(it.x-m.x)<hw+3){it.hit=true;const v=it.k==='bug'?-3:it.k==='treat'?3:1;m.score+=v;m.pop.push({x:it.x,y:it.y,t:0.6,v});if(v>0)beep(it.k==='treat'?1175:988,0.06,0.03);else sfx.bad();}}
  m.items=m.items.filter(it=>!it.hit&&it.y<156);
  if(m.t<=0){m.t=0;m.done=true;sfx.ok();setTimeout(()=>{if(mg===m)closeModal();},900);}
  $('mgT').textContent=Math.ceil(m.t);$('mgS').textContent=m.score;}
 const pg=g,nq=NQ,dq=DQ;g=m.ctx;NQ=0;DQ=0;
 for(let i=0;i<12;i++)R(0,i*10,W,10,mix(P.sky[0],P.sky[1],i/11));
 for(let i=0;i<3;i++){const c=clouds[i];circ(c.x,c.y+10,6,'#FFFFFF');circ(c.x+9,c.y+7,8,'#FFFFFF');circ(c.x+18,c.y+10,6,'#FFFFFF');R(c.x-6,c.y+11,30,5,'#FFFFFF');}
 for(let x=0;x<W;x++){const y=Math.round(118+Math.sin(x*0.04)*5);R(x,y,1,30,P.hillFar);}
 R(0,136,W,14,P.grass);R(0,136,W,1,mix(P.grass,'#FFFFFF',0.4));for(let x=0;x<W;x+=3)R(x,140+(x*7)%5,1,2,P.grassD);
 const treat=FOODS.find(f=>f.season===se).id;
 for(const it of m.items){if(it.k==='star'){drawIcon('star',it.x-4,it.y-4,1);if(Math.floor(time*8+it.x)%3===0)R(it.x+rint(-5,5),it.y-7,1,1,'#FFFFFF');}else drawIcon(it.k==='bug'?'bug':treat,it.x-4,it.y-4,1);}
 drawClawd(Math.round(m.x),138,petSize(),{stage:S.stage,form:S.form,hat:S.hat,noTint:true,happy:m.done,walk:Math.abs(m.tx-m.x)>1?Math.floor(m.walk*8)%2:null,lift:m.done?Math.abs(Math.sin(time*9))*4:0});
 for(const pp of m.pop){pp.t-=dt;pp.y-=20*dt;const c=pp.v>0?'#FFFFFF':'#FF4D6D';R(pp.x-1,pp.y,3,1,c);if(pp.v>0)R(pp.x,pp.y-1,1,3,c);}
 m.pop=m.pop.filter(pp=>pp.t>0);
 g=pg;NQ=nq;DQ=dq;
}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
 if(fishing){hookTap();return;}
 if(shoot&&y<96){const rew=rint(15,40);shoot=null;S.n.stars++;addCoins(rew,x,y);gainXP(5);quest('star');sfx.big();spawnFx('spark',x,y,10);toast(`⭐ Wish granted! <b>+${rew} coins</b>`);checkAch();return;}
 if(visitor&&Math.abs(visitor.x-x)<10&&y>visitor.y-16&&y<visitor.y+4){animalMenu();return;}
 for(let i=bugs.length-1;i>=0;i--){const b=bugs[i];if(Math.abs(b.x-x)<8&&Math.abs(b.y-y)<8){bugs.splice(i,1);const rew=(b.gold?rint(15,30):rint(1,3))*(S.buddy==='owl'?2:1);if(b.gold){S.n.gold++;sfx.coin();spawnFx('spark',b.x,b.y,8);}else sfx.squash();
  fxs.push({type:'splat',x:b.x,y:b.y,vx:0,vy:0,life:0.3});S.n.bugs++;addCoins(rew,b.x,b.y-6);gainXP(1);quest('bug');S.stats.clean=clamp(S.stats.clean+1,0,100);return;}}
 if(S.stage===0){if(Math.abs(x-100)<16&&y>100&&y<138)tapEgg();return;}
 const bx=petBox();if(!S.sleeping&&!(pet.anim&&['ride','slide'].includes(pet.anim.type))&&x>bx.x0&&x<bx.x1&&y>bx.y0&&y<bx.y1){petClawd();return;}
 hotTap(x,y);});
$('bFeed').onclick=()=>{sfx.tap();feedMenu();};$('bSleep').onclick=toggleSleep;$('bStudy').onclick=()=>{sfx.tap();studyGame();};$('bPlay').onclick=()=>{sfx.tap();playGame();};
$('bBath').onclick=bath;$('bShop').onclick=()=>{sfx.tap();shopMenu();};$('tQuests').onclick=()=>{sfx.tap();questMenu();};$('tTroph').onclick=()=>{sfx.tap();trophyMenu();};
$('tFriends').onclick=friendsMenu;document.querySelectorAll('.loc').forEach(b=>b.onclick=()=>goTo(b.dataset.loc));
$('tJournal').onclick=()=>{sfx.tap();journalMenu();};$('tSound').onclick=()=>{S.mute=!S.mute;sfx.tap();updateHUD();};

/* ---------- main loop ---------- */
let lastT=performance.now(),secT=0,saveT=0,hiddenAt=0;
function frame(now){
 const dt=Math.min(0.1,(now-lastT)/1000);lastT=now;const time=now/1000;
 update(dt);
 g=mainCtx;drawScene(time);
 if(mg)mgFrame(dt,time);if(dash)dashFrame(dt,time);
 hudT-=dt;if(hudT<=0){hudT=0.2;updateHUD();}
 secT+=dt;if(secT>1){secT=0;checkAch();if(S.daily.date!==today()){if(dailyCheck()&&$('modal').classList.contains('hidden'))dailyReward();}}
 saveT+=dt;if(saveT>5){saveT=0;if(!noSave)save();}
 requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();if(!noSave)save();}else if(hiddenAt){const sec=(Date.now()-hiddenAt)/1000;hiddenAt=0;lastT=performance.now();if(!paused){const r=applyAway(sec);if(r&&r.gift&&$('modal').classList.contains('hidden'))welcomeBack(r);}}});
window.onbeforeunload=()=>{if(!noSave)save();};

/* ---------- boot ---------- */
(function boot(){
 document.querySelectorAll('img[data-ic]').forEach(im=>im.src=iconURL(im.dataset.ic));$('coinImg').src=iconURL('coin');
 const had=load();let away=null;if(S.sleeping)S.loc='home';if(S.stage>0&&!S.fav)S.fav=pickFav();
 if(had)away=applyAway((Date.now()-S.lastSeen)/1000);
 lastSeason=seasonIdx();if(!S.seasons.includes(lastSeason))S.seasons.push(lastSeason);
 initParticles();applyTheme();
 pendingDaily=dailyCheck();
 updateHUD();
 if(!had){pendingDaily=false;openModal(`<h2>CLAWD DAYS</h2><p class="center"><img class="px" src="${formURL('none')}" width="96" height="96" alt=""></p><p>A mysterious orange egg has appeared in your garden.</p><p>Hatch it, then keep Clawd <b>fed</b>, <b>rested</b>, <b>happy</b> and <b>clean</b>. Study at school, play at the funfair, and explore the lake. Every place has its own food and animal visitors who can become Clawd's buddies. The way you raise Clawd decides who he becomes.</p><p>Days pass and seasons turn. Come back every day for gifts and new quests!</p><p class="center"><button class="btn big" id="startBtn">START</button></p>`,()=>{sfx.ok();dailyReward();});$('startBtn').onclick=closeModal;}
 else if(away&&away.gift)welcomeBack(away);
 else if(pendingDaily){pendingDaily=false;dailyReward();}
 requestAnimationFrame(frame);
})();
window.G={get S(){return S;},set(h,season){const d=season!=null?season*DAYS_PER_SEASON:dayIdx();S.clock=d*24+h;},pet,get bugs(){return bugs;},weather,pause(v){paused=v;},goTo,get visitor(){return visitor;},hotTap,get fishing(){return fishing;},ball,spawn(id){visitor={id,x:60,y:138,tx:60,dir:1,stay:99,wait:9,t:0,hi:false,treat:false,leaving:false,mv:false};}};
</script>
